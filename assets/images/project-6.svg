    <path d="M100 58 h20 M100 66 h20"/>
    <circle cx="160" cy="63" r="5"/>

    <!-- head / sensor -->
    <path d="M182 56 h12 a6 6 0 0 1 6 6 v4 a6 6 0 0 1 -6 6 h-12" fill="#F08080"/>
    <path d="M200 62 h6 M200 68 h6"/>

    <!-- near-side legs -->
