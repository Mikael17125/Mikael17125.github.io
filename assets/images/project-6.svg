    <path d="M94 74 L78 98 L94 120" fill="none"/>

    <!-- joints -->
    <circle cx="168" cy="74" r="5" fill="#F08080"/>
    <circle cx="152" cy="98" r="5" fill="#F08080"/>
    <circle cx="94" cy="74" r="5" fill="#F08080"/>
    <circle cx="78" cy="98" r="5" fill="#F08080"/>

    <!-- feet -->
    <path d="M161 122 h14 M87 122 h14"/>
